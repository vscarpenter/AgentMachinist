# AgentMachinist configuration
# Docs: https://github.com/vscarpenter/AgentMachinist
# Unknown keys are rejected — typos fail loudly instead of being ignored.

version: 1

# The ask-vs-act boundary travels with the prompts that have to honor it.
instructions:
  execute:
    paths: [docs/approval-policy.md]
  review:
    paths: [docs/approval-policy.md]

harness:
  name: claude-code            # claude-code | opencode | pi | codex
  command: null                # optional: override the harness executable path
  timeout_minutes: 30          # Phase 3 implementation budget (1-240)
  spec_timeout_minutes: 10     # Phase 1 spec-writing budget (1-60)

github:
  repo: null                   # "owner/repo"; null = gh derives it from origin
  spec_source: github-actions  # this repository uses CI for Phase 1
  spec_install: checkout       # Phase 1 uses this checkout, not the last PyPI pin
  labels:
    trigger: agent-task        # issues with this label enter the pipeline
    approved: "machinist:approved"   # PRs with this label get implemented
  poll_interval_seconds: 60    # how often `machinist watch` polls (min 10)

workspace:
  root: ~/.machinist/workspaces
  strategy: worktree           # worktree (shared object store) | clone
  cleanup: on_success          # always | on_success | never
  branch_prefix: agent/        # spec branches become <prefix>issue-<number>

# Run the fast CI checks first; coverage runs the full suite once.
# Packaging and the OS/Python matrix remain separate release/CI checks.
verification:
  gates:
    - name: workflows
      command: bash scripts/verify.sh workflows
      timeout_minutes: 5
      required: true
      mutation_policy: forbid
    - name: format
      command: bash scripts/verify.sh format
      timeout_minutes: 5
      required: true
      mutation_policy: forbid
    - name: lint
      command: bash scripts/verify.sh lint
      timeout_minutes: 5
      required: true
      mutation_policy: forbid
    - name: types
      command: bash scripts/verify.sh types
      timeout_minutes: 10
      required: true
      mutation_policy: forbid
    - name: coverage
      command: bash scripts/verify.sh coverage
      timeout_minutes: 15
      required: true
      mutation_policy: forbid

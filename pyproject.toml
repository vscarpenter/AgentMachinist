[project]
name = "agentmachinist"
version = "0.14.0"
description = "Local-first verified coding workflow with optional GitHub and GitLab publication"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Vinny Carpenter", email = "vscarpenter@gmail.com" }]
keywords = ["agents", "ci", "github", "gitlab", "claude-code", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "click>=8.1",
    "pydantic>=2.7",
    "pyyaml>=6.0.1",
]

[project.urls]
Homepage = "https://github.com/vscarpenter/AgentMachinist"
Repository = "https://github.com/vscarpenter/AgentMachinist"
Issues = "https://github.com/vscarpenter/AgentMachinist/issues"

[project.scripts]
machinist = "machinist.cli:main"

[dependency-groups]
dev = [
    "hatchling==1.32.0",
    "mypy==2.3.1",
    "pytest>=8.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.5",
    "types-pyyaml==6.0.12.20260815",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/machinist"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/machinist",
  "/tests",
  "/scripts",
  "/pyproject.toml",
  "/uv.lock",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/.gitignore",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Keep the first lint ratchet focused: syntax/import correctness and the
# high-signal bugbear rules, with stylistic layout owned by `ruff format`.
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.12"
show_error_codes = true
warn_unused_configs = true
# TODO(static-types): expand this zero-error gate to all of src/machinist once
# the CLI read-model and dynamic Harness runner annotations are made precise.
files = [
    "src/machinist/config.py",
    "src/machinist/diagnostics.py",
    "src/machinist/gitconfig.py",
    "src/machinist/lifecycle.py",
    "src/machinist/workspace.py",
    "src/machinist/process.py",
    "src/machinist/updates.py",
    "src/machinist/verification.py",
    "src/machinist/dispatch.py",
    "src/machinist/forge.py",
    "src/machinist/gitlab.py",
    "src/machinist/local_cli.py",
    "src/machinist/local_doctor.py",
    "src/machinist/local_setup.py",
    "src/machinist/local_tasks.py",
    "src/machinist/local_workflow.py",
    "src/machinist/local_workspace.py",
    "src/machinist/phases/local.py",
    "src/machinist/publication.py",
    "src/machinist/rehearsal.py",
    "src/machinist/task_drafts.py",
    "src/machinist/transitions.py",
]

[tool.coverage.run]
source = ["machinist"]

[tool.coverage.report]
fail_under = 80
show_missing = true

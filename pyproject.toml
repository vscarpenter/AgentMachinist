[project]
name = "agentmachinist"
version = "0.2.0"
description = "Local-first issue-to-PR build pipeline for coding harnesses"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Vinny Carpenter", email = "vscarpenter@gmail.com" }]
keywords = ["agents", "ci", "github", "claude-code", "developer-tools"]
dependencies = [
    "click>=8.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/vscarpenter/AgentMachinist"
Repository = "https://github.com/vscarpenter/AgentMachinist"
Issues = "https://github.com/vscarpenter/AgentMachinist/issues"

[project.scripts]
machinist = "machinist.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/machinist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

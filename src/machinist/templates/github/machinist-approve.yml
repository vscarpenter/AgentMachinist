# AgentMachinist - bind approval to the PR's exact head commit.
#
# Both authorization paths check the actor before any approval evidence is
# minted. A '/machinist-execute' comment is honored only from the repo owner,
# an org member, or a collaborator, then both paths require write or admin
# access. GitHub's association and label permissions are broader than push
# authority, so neither is sufficient by itself. The approver's login is
# recorded on the approval comment either way.

name: Machinist Approve

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [labeled]

permissions:
  pull-requests: write
  issues: write

jobs:
  approve:
    if: >-
      (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && startsWith(github.event.comment.body, '/machinist-execute')
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
      || (github.event_name == 'pull_request_target'
        && github.event.label.name == '__APPROVED_LABEL__')
    runs-on: ubuntu-latest
    steps:
      - name: Require an approval command bound to a commit
        if: github.event_name == 'issue_comment'
        env:
          COMMAND: ${{ github.event.comment.body }}
        run: |
          NORMALIZED="$(printf '%s' "$COMMAND" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          [[ "$NORMALIZED" =~ ^/machinist-execute[[:space:]]+([0-9a-fA-F]{40})$ ]] || {
            echo "Expected /machinist-execute followed by the full approved commit SHA" >&2
            exit 1
          }
          printf 'APPROVED_SHA=%s\n' "${BASH_REMATCH[1],,}" >> "$GITHUB_ENV"

      - name: Require write access for either approval path
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.event.sender.login }}
        run: |
          # Fails closed: an API error leaves PERMISSION empty, which falls
          # through to the rejection below rather than approving anything.
          PERMISSION="$(gh api \
            "repos/${{ github.repository }}/collaborators/$ACTOR/permission" \
            --jq .permission || true)"
          case "$PERMISSION" in
            admin | write) ;;
            *)
              echo "$ACTOR has '${PERMISSION:-unknown}' access; approving execution requires write access" >&2
              exit 1
              ;;
          esac
          printf 'APPROVER=%s\n' "$ACTOR" >> "$GITHUB_ENV"

      - name: Bind approval to the authorized PR head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            HEAD_SHA="$APPROVED_SHA"
          else
            HEAD_SHA="$EVENT_HEAD_SHA"
          fi
          CURRENT_SHA="$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefOid --jq .headRefOid)"
          [[ "$CURRENT_SHA" == "$HEAD_SHA" ]] || {
            echo "PR head changed after authorization ($CURRENT_SHA != $HEAD_SHA); approve again" >&2
            exit 1
          }
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" \
            --body "Approved by @$APPROVER for \`$HEAD_SHA\`. <!-- agentmachinist:approval sha=$HEAD_SHA -->"
          if [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            gh pr edit "$PR_NUMBER" --repo "${{ github.repository }}" \
              --add-label "__APPROVED_LABEL__"
          fi

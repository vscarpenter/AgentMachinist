# Publishes agentmachinist to PyPI when a GitHub Release is published.
#
# Uses PyPI Trusted Publishing (OIDC) — no API tokens stored anywhere.
# One-time setup on pypi.org is required first; see README "Releasing".

name: Release to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          test "${RELEASE_TAG#v}" = "$PACKAGE_VERSION" || {
            echo "release tag $RELEASE_TAG does not match package version $PACKAGE_VERSION" >&2
            exit 1
          }

      - name: Run tests
        run: uv run pytest -o addopts= --tb=short

      - name: Build sdist and wheel
        run: |
          rm -rf dist
          uv build

      - name: Smoke-test installed wheel
        run: bash scripts/smoke-wheel.sh

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

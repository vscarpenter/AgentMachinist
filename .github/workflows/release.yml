# Publishes agentmachinist to PyPI when a GitHub Release is published.
#
# The build job is unprivileged. Only the small publish job can request a PyPI
# OIDC token, and it publishes the exact artifact produced by the build job.

name: Release to PyPI

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          version: "0.12.5"

      - name: Verify tag matches package version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          test "${RELEASE_TAG#v}" = "$PACKAGE_VERSION" || {
            echo "release tag $RELEASE_TAG does not match package version $PACKAGE_VERSION" >&2
            exit 1
          }
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tests, workflows, and distributions
        run: bash scripts/verify.sh

      - name: Stage distributions and checksums
        run: |
          mkdir -p artifacts/packages
          cp dist/*.whl dist/*.tar.gz artifacts/packages/
          (cd artifacts/packages && sha256sum * > ../SHA256SUMS)

      - name: Upload verified release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: |
            artifacts/packages/*
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing only
    steps:
      - name: Download verified release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: artifacts

      - name: Verify artifact checksums
        run: (cd artifacts/packages && sha256sum --check ../SHA256SUMS)

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: artifacts/packages/

  release-assets:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: artifacts

      - name: Verify artifact checksums
        run: (cd artifacts/packages && sha256sum --check ../SHA256SUMS)

      - name: Attach distributions and checksums to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" artifacts/packages/* artifacts/SHA256SUMS --clobber

  verify-published:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    env:
      PACKAGE_VERSION: ${{ needs.build.outputs.package_version }}
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          version: "0.12.5"

      - name: Wait for the release to reach PyPI
        run: |
          for attempt in {1..10}; do
            if python - "$PACKAGE_VERSION" <<'PY'
          import json
          import sys
          import urllib.request

          version = sys.argv[1]
          with urllib.request.urlopen(
              f"https://pypi.org/pypi/agentmachinist/{version}/json", timeout=10
          ) as response:
              metadata = json.load(response)
          raise SystemExit(metadata["info"]["version"] != version)
          PY
            then
              exit 0
            fi
            if [[ "$attempt" -eq 10 ]]; then
              echo "agentmachinist $PACKAGE_VERSION did not become visible on PyPI" >&2
              exit 1
            fi
            sleep 15
          done

      - name: Smoke-test the published command
        # The JSON API above can show the release before uv's simple-index
        # resolver does, so retry resolution; a wrong version still fails hard.
        run: |
          for attempt in {1..10}; do
            if OUTPUT="$(uv tool run --isolated --no-cache --from "agentmachinist==$PACKAGE_VERSION" machinist --version)"; then
              echo "$OUTPUT"
              grep -F "$PACKAGE_VERSION" <<< "$OUTPUT"
              exit 0
            fi
            if [[ "$attempt" -eq 10 ]]; then
              echo "agentmachinist $PACKAGE_VERSION could not be installed from PyPI" >&2
              exit 1
            fi
            sleep 15
          done

# agentmachinist-managed-sha256: b214c8df2bf3af3eacba72ab243f07d9a23df0d56002dd36e3365394cd576387
# AgentMachinist — Phase 1 in CI: generate a spec and open a draft PR
# when an issue receives the configured trigger label.
#
# Requires the configured Harness API-key repository secret (Settings → Secrets).
# To run Phase 1 locally, set github.spec_source: local and run
# `machinist sync-workflows`. Review, commit, and merge the generated removal;
# then `machinist watch` handles labeled issues on your machine.

name: Machinist Spec Generation

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  generate-spec:
    if: github.event.label.name == 'agent-task'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          version: "0.12.5"

      - name: Install AgentMachinist
        run: uv sync --frozen

      - name: Install coding Harness
        run: npm install -g @anthropic-ai/claude-code@2.1.251

      - name: Generate spec and open draft PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run machinist spec ${{ github.event.issue.number }}

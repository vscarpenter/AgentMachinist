# Test suite for AgentMachinist itself. No secrets needed: the tests
# never touch the network (gh and harness subprocesses are faked; git
# tests run against local repos in tmp dirs).

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          version: "0.12.5"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -o addopts= --tb=short

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"

      - name: Build sdist and wheel
        run: |
          rm -rf dist
          uv build

      - name: Smoke-test installed wheel
        run: bash scripts/smoke-wheel.sh

# AgentMachinist — Phase 2 convenience: convert a '/machinist-execute'
# comment on a machinist draft PR into the 'machinist:approved' label.
#
# Only comments from the repo owner, org members, or collaborators are
# honored; anyone else commenting the command is ignored.

name: Machinist Approve

on:
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  issues: write

jobs:
  approve:
    if: >-
      github.event.issue.pull_request
      && startsWith(github.event.comment.body, '/machinist-execute')
      && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Apply approval label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --add-label "machinist:approved"
